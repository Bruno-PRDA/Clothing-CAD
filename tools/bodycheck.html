<script type="module">
// Numeric checks for the template body. Runs whatever ?do= asks for and prints plain text, so the
// results can be read back with get_page_text. ?do=macro,measure,fit,...
import { loadTemplate, applyTargets, computeNormals, jointAt } from '/src/body/template.js';
import * as Macro from '/src/body/macro.js';
import { measureTemplate } from '/src/body/measureTemplate.js';
import { buildIndex, horizontalSegments, components, girthAt, limbGirth } from '/src/body/section.js';
import * as Fit from '/src/body/fit.js';
import * as FitLS from '/src/body/fitLS.js';
import { estimateMeasurements } from '/src/body/params.js';
import { bakeMeshSdf } from '/src/body/sdfMesh.js';
import { sampleSdf, gridContains } from '/src/core/sdf.js';
import { buildTemplateBody } from '/src/body/templateModel.js';
import { BODY_PRESETS } from '/src/body/presets.js';

const q = new URLSearchParams(location.search);
const todo = (q.get('do') || 'macro').split(',').map(s => s.trim()).filter(Boolean);
const out = document.getElementById('out');
const L = [];
const say = (s = '') => { L.push(s); out.textContent = L.join('\n'); };
const head = (s) => say('\n=== ' + s + ' ===');

const t0 = performance.now();
const tpl = await loadTemplate('/assets/body/');
say(`template: ${tpl.nVerts} verts (${tpl.nBodyVerts} body), ${tpl.nTris} tris, ${tpl.targets.size} targets, ` +
    `rest height ${tpl.restHeight_m.toFixed(4)} m, loaded in ${(performance.now() - t0).toFixed(0)} ms`);

const CASES = [
  ['female_s', { height_cm: 160, weight_kg: 53, muscle: 0.30, age_y: 28, sex: 1, bustFullness: 0.35 }],
  ['female_m', { height_cm: 165, weight_kg: 58.5, muscle: 0.35, age_y: 30, sex: 1, bustFullness: 0.40 }],
  ['female_l', { height_cm: 170, weight_kg: 70, muscle: 0.30, age_y: 35, sex: 1, bustFullness: 0.50 }],
  ['male_s', { height_cm: 172, weight_kg: 65, muscle: 0.45, age_y: 28, sex: 0, bustFullness: 0 }],
  ['male_m', { height_cm: 178, weight_kg: 75, muscle: 0.50, age_y: 32, sex: 0, bustFullness: 0 }],
  ['male_l', { height_cm: 184, weight_kg: 92, muscle: 0.40, age_y: 45, sex: 0, bustFullness: 0 }],
  ['child_10', { height_cm: 140, weight_kg: 33, muscle: 0.30, age_y: 10, sex: 0.5, bustFullness: 0 }],
  ['plus_f', { height_cm: 168, weight_kg: 92, muscle: 0.25, age_y: 40, sex: 1, bustFullness: 0.70 }],
  ['athletic_m', { height_cm: 182, weight_kg: 80, muscle: 0.85, age_y: 27, sex: 0, bustFullness: 0 }],
];

function bodyOf(p, heightSlider) {
  const w = Macro.macroWeightsFor(p, heightSlider);
  return { weights: w, pos: applyTargets(tpl, w) };
}
function heightOf(pos) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < tpl.nBodyVerts; i++) { const y = pos[i * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  return hi - lo;
}

if (todo.includes('macro')) {
  head('macro weights');
  let missing = 0, worstSum = 0;
  for (const [name, p] of CASES) {
    const s = Macro.macroSliders(p);
    const w = Macro.macroWeights(s);
    let sum = 0; const bad = [];
    for (const [k, v] of w) {
      sum += v;
      // the average/average build corner is an all-zero MakeHuman file our asset build drops
      if (!tpl.targets.has(k) && !/universal-.*-averagemuscle-averageweight$/.test(k)) bad.push(k);
    }
    missing += bad.length;
    worstSum = Math.max(worstSum, Math.abs(sum - 2));   // ethnicity layer + build layer = 1 + 1
    say(`${name.padEnd(11)} female=${s.female.toFixed(2)} age=${s.age.toFixed(3)} muscle=${s.muscle.toFixed(2)} ` +
        `weight=${s.weight.toFixed(3)} | ${String(w.size).padStart(2)} targets sum=${sum.toFixed(4)}` +
        (bad.length ? `  MISSING: ${bad.join(', ')}` : ''));
  }
  say(missing === 0 ? `<ok>all target names resolve</ok>` : `<bad>${missing} missing target names</bad>`);
  say(worstSum < 1e-6 ? `<ok>weights partition exactly (ethnic 1 + build 1)</ok>`
                      : `<bad>weight sums off by up to ${worstSum.toFixed(6)}</bad>`);
}

if (todo.includes('height')) {
  head('height slider response (macro only, no solve yet)');
  for (const [name, p] of CASES) {
    const hs = [0, 0.25, 0.5, 0.75, 1].map((h) => heightOf(bodyOf(p, h).pos));
    say(`${name.padEnd(11)} wanted ${(p.height_cm / 100).toFixed(3)} m | slider 0..1 -> ` +
        hs.map((h) => h.toFixed(3)).join('  '));
  }
}

if (todo.includes('perf')) {
  head('morph cost');
  const p = CASES[1][1];
  const w = Macro.macroWeightsFor(p, 0.7);
  const buf = new Float32Array(tpl.rest.length);
  let t = performance.now(); for (let i = 0; i < 20; i++) applyTargets(tpl, w, buf);
  const morph = (performance.now() - t) / 20;
  const nbuf = new Float32Array(tpl.rest.length);
  t = performance.now(); for (let i = 0; i < 20; i++) computeNormals(tpl, buf, nbuf);
  const norm = (performance.now() - t) / 20;
  say(`applyTargets ${morph.toFixed(2)} ms  (${w.size} targets)`);
  say(`computeNormals ${norm.toFixed(2)} ms  (${tpl.nTris} tris)`);
}

if (todo.includes('joints')) {
  head('joint landmarks (female_m macro)');
  const { pos } = bodyOf(CASES[1][1]);
  const names = ['neck', 'l-shoulder', 'r-shoulder', 'l-elbow', 'l-hand', 'pelvis', 'l-upper-leg', 'l-knee', 'l-ankle', 'head', 'spine-2'];
  for (const n of names) {
    const j = jointAt(tpl, pos, n);
    say(`  ${n.padEnd(12)} ${j ? j.map((v) => v.toFixed(3)).join(', ') : '<bad>MISSING</bad>'}`);
  }
  say(`  (${Object.keys(tpl.joints).length} joint groups available)`);
}

if (todo.includes('measure')) {
  head('measurements taken off the macro body (cm) — no measurement solve yet');
  const keys = ['height_cm', 'chest_cm', 'underbust_cm', 'waist_cm', 'hips_cm', 'neck_cm', 'shoulderWidth_cm',
    'upperArm_cm', 'forearm_cm', 'wrist_cm', 'thigh_cm', 'calf_cm', 'ankle_cm', 'armLength_cm',
    'inseam_cm', 'torsoLength_cm', 'headHeight_cm'];
  const WANT = {
    female_m: [165, 88, 76, 70, 96, 34, 38, 27, 23, 15.5, 54, 36, 22, 56, 76, 40, 22],
    male_m: [178, 98, 90, 84, 98, 39, 46, 30, 27, 17.5, 56, 38, 23.5, 62, 82, 44, 23],
    child_10: [140, 68, 62, 60, 72, 28, 31, 20, 18, 13, 40, 28, 19, 47, 65, 33, 20],
    plus_f: [168, 112, 98, 100, 122, 38, 41, 36, 28, 17.5, 68, 43, 25, 57, 76, 41, 22.5],
  };
  say('body'.padEnd(12) + keys.map((k) => k.replace('_cm', '').slice(0, 7).padStart(8)).join(''));
  const tA = performance.now();
  for (const [name, p] of CASES) {
    const { pos } = bodyOf(p);
    const m = measureTemplate(tpl, pos);
    say(name.padEnd(12) + keys.map((k) => m[k].toFixed(1).padStart(8)).join(''));
    if (WANT[name]) say(('  want').padEnd(12) + WANT[name].map((v) => v.toFixed(1).padStart(8)).join(''));
  }
  say(`(${((performance.now() - tA) / CASES.length).toFixed(0)} ms per full measurement)`);
}

if (todo.includes('sdf')) {
  head('mesh -> SDF bake');
  const params = { height_cm: 165, weight_kg: 58.5, muscle: 0.35, age_y: 30, sex: 1, bustFullness: 0.40 };
  const { pos } = bodyOf(params);
  window.__sdfPos = pos;

  for (const cell of [0.015, 0.030]) {
    const t0 = performance.now();
    const grid = bakeMeshSdf(pos, tpl.indices, { cell, nVerts: tpl.nBodyVerts });
    const ms = performance.now() - t0;
    const n = grid.nx * grid.ny * grid.nz;
    let neg = 0, nan = 0;
    for (let i = 0; i < n; i++) { const v = grid.data[i]; if (v < 0) neg++; if (!Number.isFinite(v)) nan++; }
    say(`cell ${(cell * 1000).toFixed(0)}mm: ${grid.nx}x${grid.ny}x${grid.nz} = ${n.toLocaleString()} nodes in ${ms.toFixed(0)} ms` +
        `  inside ${(100 * neg / n).toFixed(1)}%  ${nan ? `<bad>${nan} non-finite</bad>` : '<ok>all finite</ok>'}`);
    if (cell !== 0.015) continue;

    // --- accuracy: sample points just off the surface and compare with brute-force exact distance ---
    // Surface points are triangle centroids pushed along their own normal, so we know the truth.
    const idx = tpl.indices;
    const exact = (px, py, pz) => {
      let best = Infinity;
      for (let t = 0; t < tpl.nTris; t++) {
        const a = idx[t * 3] * 3, b = idx[t * 3 + 1] * 3, c = idx[t * 3 + 2] * 3;
        const d2 = ptTri2(px, py, pz, pos, a, b, c);
        if (d2 < best) best = d2;
      }
      return Math.sqrt(best);
    };
    // Split the probes by region. The garment only ever touches the torso and the limbs, and the SDF's
    // trilinear error grows as cell^2 / (8 * feature radius) — 0.2 mm on a 150 mm torso but 2.8 mm on a
    // 10 mm finger, which at a 15 mm cell cannot be represented at all. Judging the grid on fingers and
    // noses would be judging it on geometry no cloth will ever reach.
    const excl = [];
    for (const name of Object.keys(tpl.joints)) {
      if (!/finger|toe|eye|lid|jaw|tongue|teeth|head|mouth|ground/.test(name)) continue;
      const j = jointAt(tpl, pos, name);
      if (j) excl.push(j);
    }
    const neckY = (jointAt(tpl, pos, 'neck') || [0, 1.4, 0])[1];
    const inGarmentRegion = (x, y, z) => {
      if (y > neckY) return false;
      for (const e of excl) {
        const dx = x - e[0], dy = y - e[1], dz = z - e[2];
        if (dx * dx + dy * dy + dz * dz < 0.06 * 0.06) return false;
      }
      return true;
    };

    let worstAbs = 0, sumAbs = 0, wrongSign = 0, gradSum = 0, gradWorst = 0, samples = 0;
    let dWorst = 0, dSum = 0, dWrong = 0, dSamples = 0;
    const fails = [];
    const g = [0, 0, 0];
    for (let t = 7; t < tpl.nTris; t += 811) {         // ~33 spread-out triangles
      const a = idx[t * 3] * 3, b = idx[t * 3 + 1] * 3, c = idx[t * 3 + 2] * 3;
      const cxp = (pos[a] + pos[b] + pos[c]) / 3;
      const cyp = (pos[a + 1] + pos[b + 1] + pos[c + 1]) / 3;
      const czp = (pos[a + 2] + pos[b + 2] + pos[c + 2]) / 3;
      const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
      const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
      let nxx = uy * vz - uz * vy, nyy = uz * vx - ux * vz, nzz = ux * vy - uy * vx;
      const L = Math.hypot(nxx, nyy, nzz) || 1; nxx /= L; nyy /= L; nzz /= L;
      for (const off of [-0.01, -0.004, 0.004, 0.01]) {
        const px = cxp + nxx * off, py = cyp + nyy * off, pz = czp + nzz * off;
        if (!gridContains(grid, px, py, pz)) continue;
        const got = sampleSdf(grid, px, py, pz, g);
        const want = exact(px, py, pz);
        const err = Math.abs(Math.abs(got) - want);
        // Ground truth from an exact ray cast, NOT from the sign of `off`: 10 mm along a finger's
        // outward normal is inside the next finger, so the offset's sign is not a reliable oracle.
        const truthInside = rayInside(px, py, pz);
        const bad = (got < 0) !== truthInside;
        if (inGarmentRegion(px, py, pz)) {
          worstAbs = Math.max(worstAbs, err); sumAbs += err; samples++;
          if (bad) { wrongSign++; fails.push(`(${px.toFixed(3)}, ${py.toFixed(3)}, ${pz.toFixed(3)}) off ${(off * 1000).toFixed(0)}mm got ${(got * 1000).toFixed(1)} truth ${truthInside ? 'in' : 'out'}`); }
          const gm = Math.hypot(g[0], g[1], g[2]);
          gradSum += gm; gradWorst = Math.max(gradWorst, Math.abs(gm - 1));
        } else {
          dWorst = Math.max(dWorst, err); dSum += err; dSamples++;
          if (bad) dWrong++;
        }
      }
    }
    say(`  torso and limbs — ${samples} probes within 10 mm of the surface:`);
    say(`    |distance| error  mean ${(1000 * sumAbs / samples).toFixed(2)} mm   worst ${(1000 * worstAbs).toFixed(2)} mm`);
    say(wrongSign === 0 ? '    <ok>sign correct on every probe</ok>' : `    <bad>${wrongSign}/${samples} wrong sign</bad>`);
    for (const f of fails.slice(0, 6)) say('      ' + f);
    say(`  head, hands and feet — ${dSamples} probes (cloth never reaches these):`);
    say(`    |distance| error  mean ${(1000 * dSum / Math.max(1, dSamples)).toFixed(2)} mm   worst ${(1000 * dWorst).toFixed(2)} mm   wrong sign ${dWrong}/${dSamples}`);
    // Trilinear error goes as cell^2 / (8 * feature radius): 0.2 mm on a 150 mm torso, ~2 mm in the
    // crease of an armpit. The solver's own collision offset is 5 mm, so 3 mm of field error is inside
    // the tolerance the contact already works to.
    const tol = 0.003;
    say(worstAbs < tol && wrongSign === 0
      ? `    <ok>garment region within ${(tol * 1000).toFixed(1)} mm and correctly signed</ok>`
      : `    <bad>garment region: worst ${(worstAbs * 1000).toFixed(2)} mm, ${wrongSign} wrong signs</bad>`);
  }
}

/**
 * Exact inside test by ray parity in double precision, against every triangle. Slow and obviously
 * correct, which is what a reference is for.
 */
function rayInside(px, py, pz) {
  const idx = tpl.indices, P = window.__sdfPos;
  let hits = 0;
  for (let t = 0; t < tpl.nTris; t++) {
    const a = idx[t * 3] * 3, b = idx[t * 3 + 1] * 3, c = idx[t * 3 + 2] * 3;
    const ax = P[a], ay = P[a + 1], az = P[a + 2];
    const bx = P[b], by = P[b + 1], bz = P[b + 2];
    const cx = P[c], cy = P[c + 1], cz = P[c + 2];
    const d = (by - cy) * (ax - cx) + (cx - bx) * (ay - cy);
    if (d === 0) continue;
    const inv = 1 / d;
    const l0 = ((by - cy) * (px - cx) + (cx - bx) * (py - cy)) * inv;
    if (l0 < 0 || l0 > 1) continue;
    const l1 = ((cy - ay) * (px - cx) + (ax - cx) * (py - cy)) * inv;
    if (l1 < 0 || l1 > 1) continue;
    const l2 = 1 - l0 - l1;
    if (l2 < 0 || l2 > 1) continue;
    if (l0 * az + l1 * bz + l2 * cz > pz) hits++;   // count crossings ABOVE the point
  }
  return (hits & 1) === 1;
}

/** Squared point-triangle distance against a flat position array — the reference for the check above. */
function ptTri2(px, py, pz, P, a, b, c) {
  const ax = P[a], ay = P[a + 1], az = P[a + 2];
  const bx = P[b], by = P[b + 1], bz = P[b + 2];
  const cx = P[c], cy = P[c + 1], cz = P[c + 2];
  const abx = bx - ax, aby = by - ay, abz = bz - az;
  const acx = cx - ax, acy = cy - ay, acz = cz - az;
  const apx = px - ax, apy = py - ay, apz = pz - az;
  const d1 = abx * apx + aby * apy + abz * apz, d2 = acx * apx + acy * apy + acz * apz;
  if (d1 <= 0 && d2 <= 0) return apx * apx + apy * apy + apz * apz;
  const bpx = px - bx, bpy = py - by, bpz = pz - bz;
  const d3 = abx * bpx + aby * bpy + abz * bpz, d4 = acx * bpx + acy * bpy + acz * bpz;
  if (d3 >= 0 && d4 <= d3) return bpx * bpx + bpy * bpy + bpz * bpz;
  const cpx = px - cx, cpy = py - cy, cpz = pz - cz;
  const d5 = abx * cpx + aby * cpy + abz * cpz, d6 = acx * cpx + acy * cpy + acz * cpz;
  if (d6 >= 0 && d5 <= d6) return cpx * cpx + cpy * cpy + cpz * cpz;
  const vc = d1 * d4 - d3 * d2;
  if (vc <= 0 && d1 >= 0 && d3 <= 0) { const t = d1 / (d1 - d3); const qx = apx - abx * t, qy = apy - aby * t, qz = apz - abz * t; return qx * qx + qy * qy + qz * qz; }
  const vb = d5 * d2 - d1 * d6;
  if (vb <= 0 && d2 >= 0 && d6 <= 0) { const t = d2 / (d2 - d6); const qx = apx - acx * t, qy = apy - acy * t, qz = apz - acz * t; return qx * qx + qy * qy + qz * qz; }
  const va = d3 * d6 - d5 * d4;
  if (va <= 0 && (d4 - d3) >= 0 && (d5 - d6) >= 0) {
    const t = (d4 - d3) / ((d4 - d3) + (d5 - d6));
    const qx = apx - abx - (acx - abx) * t, qy = apy - aby - (acy - aby) * t, qz = apz - abz - (acz - abz) * t;
    return qx * qx + qy * qy + qz * qz;
  }
  const den = 1 / (va + vb + vc), v = vb * den, w = vc * den;
  const qx = apx - (abx * v + acx * w), qy = apy - (aby * v + acy * w), qz = apz - (abz * v + acz * w);
  return qx * qx + qy * qy + qz * qz;
}

if (todo.includes('model')) {
  head('full BodyModel from the template (real presets)');
  const SEX = { female_s: 1, female_m: 1, female_l: 1, plus_f: 1, male_s: 0, male_m: 0, male_l: 0, athletic_m: 0, child_10: 0.5 };
  for (const id of ['female_m', 'male_m', 'child_10', 'plus_f']) {
    const params = { ...BODY_PRESETS[id], sex: SEX[id] };
    let mdl = null, err = null;
    try { mdl = buildTemplateBody(tpl, params); } catch (e) { err = String(e && e.stack || e); }
    if (!mdl) { say(`${id.padEnd(11)} <bad>FAILED: ${err}</bad>`); continue; }
    const missing = ['params', 'landmarks', 'anchors', 'rings', 'sdf', 'geometry', 'measured', 'buildMs']
      .filter((k) => mdl[k] === undefined || mdl[k] === null);
    const noAnchor = ['torso', 'armL', 'armR', 'legL', 'legR', 'skirt', 'head'].filter((k) => !mdl.anchors[k]);
    const H = mdl.measuredFull.height_cm / 100;
    let floor = Infinity, top = -Infinity;
    for (let i = 0; i < tpl.nBodyVerts; i++) { const y = mdl.geometry.positions[i * 3 + 1]; if (y < floor) floor = y; if (y > top) top = y; }
    say(`            floor y=${floor.toFixed(4)}  top y=${top.toFixed(4)}  inseam ${mdl.measuredFull.inseam_cm.toFixed(1)}cm ` +
        `(${(100 * mdl.measuredFull.inseam_cm / (H * 100)).toFixed(0)}% of stature)`);
    const want = `${params.chest_cm}/${params.waist_cm}/${params.hips_cm}`;
    say(`${id.padEnd(11)} ${mdl.buildMs.toFixed(0).padStart(5)} ms  H ${H.toFixed(3)}m (want ${(params.height_cm / 100).toFixed(2)})  ` +
        `measured ${mdl.measured.chest_cm.toFixed(1)}/${mdl.measured.waist_cm.toFixed(1)}/${mdl.measured.hips_cm.toFixed(1)} (want ${want})` +
        (missing.length ? `  <bad>missing ${missing.join(',')}</bad>` : '') +
        (noAnchor.length ? `  <bad>no anchor ${noAnchor.join(',')}</bad>` : ''));
    const r = mdl.rings;
    say('            ring heights as % of stature: ' + ['crotch', 'hip', 'waist', 'chest', 'armpit', 'shoulder', 'neckBase']
      .map((k) => `${k} ${(100 * r[k].y / H).toFixed(0)}%`).join('  '));
    say('            real adult:                   crotch 46%  hip 53%  waist 62%  chest 72%  armpit 76%  shoulder 82%  neckBase 86%');
    say('            timing ' + Object.entries(mdl.timing).map(([k, v]) => `${k} ${v.toFixed(0)}ms`).join('  ') +
        `  | fit ${mdl.fit.rounds} rounds, ${mdl.fit.ms.toFixed(0)}ms`);
    const a = mdl.anchors;
    say(`            torso r=${(a.torso.radius * 100).toFixed(1)}cm len=${(a.torso.length * 100).toFixed(1)}cm  ` +
        `skirt r=${(a.skirt.radius * 100).toFixed(1)}cm  armL r=${(a.armL.radius * 100).toFixed(1)}cm len=${(a.armL.length * 100).toFixed(1)}cm`);
  }
}

if (todo.includes('fit')) {
  head('measurement solve');
  const gains = Fit.calibrate(tpl);
  say('cm per unit slider on the neutral template:');
  say('  ' + Object.keys(gains).map((k) => `${k.replace('_cm', '')}=${Number.isFinite(gains[k]) ? gains[k].toFixed(2) : 'n/a'}`).join('  '));
  const WANT = {
    female_m: { height_cm: 165, chest_cm: 88, underbust_cm: 76, waist_cm: 70, hips_cm: 96, neck_cm: 34, shoulderWidth_cm: 38, upperArm_cm: 27, wrist_cm: 15.5, thigh_cm: 54, calf_cm: 36, ankle_cm: 22, armLength_cm: 56, inseam_cm: 76, torsoLength_cm: 40 },
    male_m: { height_cm: 178, chest_cm: 98, underbust_cm: 90, waist_cm: 84, hips_cm: 98, neck_cm: 39, shoulderWidth_cm: 46, upperArm_cm: 30, wrist_cm: 17.5, thigh_cm: 56, calf_cm: 38, ankle_cm: 23.5, armLength_cm: 62, inseam_cm: 82, torsoLength_cm: 44 },
    plus_f: { height_cm: 168, chest_cm: 112, underbust_cm: 98, waist_cm: 100, hips_cm: 122, neck_cm: 38, shoulderWidth_cm: 41, upperArm_cm: 36, wrist_cm: 17.5, thigh_cm: 68, calf_cm: 43, ankle_cm: 25, armLength_cm: 57, inseam_cm: 76, torsoLength_cm: 41 },
    child_10: { height_cm: 140, chest_cm: 68, underbust_cm: 62, waist_cm: 60, hips_cm: 72, neck_cm: 28, shoulderWidth_cm: 31, upperArm_cm: 20, wrist_cm: 13, thigh_cm: 40, calf_cm: 28, ankle_cm: 19, armLength_cm: 47, inseam_cm: 65, torsoLength_cm: 33 },
    athletic_m: { height_cm: 182, chest_cm: 104, underbust_cm: 94, waist_cm: 82, hips_cm: 98, neck_cm: 40, shoulderWidth_cm: 49, upperArm_cm: 34, wrist_cm: 18, thigh_cm: 60, calf_cm: 40, ankle_cm: 24, armLength_cm: 64, inseam_cm: 84, torsoLength_cm: 45 },
  };
  for (const [name, p] of CASES) {
    if (!WANT[name]) continue;
    const params = { ...p, ...WANT[name] };
    const r = Fit.fitBody(tpl, params);
    const keys = Object.keys(WANT[name]);
    const errs = keys.map((k) => Math.abs(r.residual[k] || 0));
    const worst = Math.max(...errs);
    const worstKey = keys[errs.indexOf(worst)];
    const rms = Math.sqrt(errs.reduce((s, e) => s + e * e, 0) / errs.length);
    const tag = worst < 1 ? 'ok' : 'bad';
    say(`\n${name}  ${r.rounds} rounds, ${r.ms.toFixed(0)} ms  ` +
        `<${tag}>worst ${worst.toFixed(2)} cm (${worstKey}), rms ${rms.toFixed(2)} cm</${tag}>` +
        (r.clamped.length ? `  clamped: ${r.clamped.join(',')}` : ''));
    say('  ' + keys.map((k) => `${k.replace('_cm', '')} ${r.measured[k].toFixed(1)}/${WANT[name][k]}`).join('  '));
  }
}

if (todo.includes('neckprofile')) {
  head('girth up the neck column (female_m macro)');
  const { pos } = bodyOf(CASES[1][1]);
  const ix = buildIndex(tpl, pos);
  const J = (n) => jointAt(tpl, pos, n);
  const sh = J('l-shoulder'), nk = J('neck'), jw = J('jaw'), hd = J('head');
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < tpl.nBodyVerts; i++) { const y = pos[i * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  say(`  shoulder y=${sh[1].toFixed(3)}  neck y=${nk[1].toFixed(3)}  jaw y=${jw ? jw[1].toFixed(3) : 'n/a'}  head y=${hd[1].toFixed(3)}  top=${hi.toFixed(3)}`);
  for (let y = sh[1]; y <= (hd ? hd[1] : nk[1] + 0.1); y += 0.008) {
    const g = girthAt(ix, y, {});
    const comps = components(horizontalSegments(ix, y)).filter((c) => c.n >= 8).length;
    say(`   y=${y.toFixed(3)}  girth ${g ? (g.girth * 100).toFixed(1).padStart(6) : '     -'} cm  w=${g ? (g.width * 100).toFixed(1) : '-'}  loops=${comps}`);
  }
}

if (todo.includes('gains')) {
  head('gain of every non-macro target: cm moved per unit weight, on the neutral template');
  // Which target moves which measurement, and by how much. This is the calibration that decides
  // which detail targets are worth wiring into fit.js as secondary controls when a measure/ target
  // runs out of range. `?fam=stomach,torso` restricts the families; default is everything but macro/height.
  const KEYS = ['chest_cm', 'underbust_cm', 'waist_cm', 'hips_cm', 'neck_cm', 'shoulderWidth_cm', 'upperArm_cm',
    'forearm_cm', 'wrist_cm', 'thigh_cm', 'calf_cm', 'ankle_cm', 'armLength_cm', 'inseam_cm', 'torsoLength_cm', 'height_cm'];
  const fams = (q.get('fam') || '').split(',').map((s) => s.trim()).filter(Boolean);
  const names = [...tpl.targets.keys()].filter((n) => !n.startsWith('macro/') && !n.startsWith('height/'))
    .filter((n) => !fams.length || fams.includes(n.split('/')[0])).sort();
  const base = measureTemplate(tpl, tpl.rest);
  const buf = new Float32Array(tpl.rest.length);
  say(`${names.length} targets; columns are cm moved at weight +1 (only |delta| >= 0.3 cm shown)`);
  const tA = performance.now();
  const rows = [];
  for (const n of names) {
    const pos = applyTargets(tpl, [[n, 1]], buf);
    const m = measureTemplate(tpl, pos);
    const parts = [];
    let biggest = 0;
    for (const k of KEYS) {
      const d = m[k] - base[k];
      if (Math.abs(d) >= 0.3) parts.push(`${k.replace('_cm', '')} ${d > 0 ? '+' : ''}${d.toFixed(1)}`);
      biggest = Math.max(biggest, Math.abs(d));
    }
    rows.push({ n, biggest, text: `${n.padEnd(40)} ${parts.join('  ') || '(nothing >= 0.3 cm)'}` });
  }
  rows.sort((a, b) => b.biggest - a.biggest);
  for (const r of rows) say('  ' + r.text);
  say(`(${((performance.now() - tA) / Math.max(1, names.length)).toFixed(0)} ms per target)`);
  window.__gains = rows;
}

if (todo.includes('fitls')) {
  head('diagonal fit (fit.js) vs joint least-squares fit (fitLS.js), same cases');
  const tC = performance.now();
  FitLS.calibrateLS(tpl);
  say(`fitLS calibration ${(performance.now() - tC).toFixed(0)} ms once (${FitLS.CONTROLS.length} controls x 2 directions)`);
  const SEX = { female_s: 1, female_m: 1, female_l: 1, plus_f: 1, male_s: 0, male_m: 0, male_l: 0, athletic_m: 0, child_10: 0.5 };
  const cases = ['female_m', 'male_m', 'child_10', 'plus_f', 'athletic_m'].map((id) => [id, { ...BODY_PRESETS[id], sex: SEX[id] }]);
  // the acceptance case that fails today: estimate everything from 180 cm / 95 kg
  cases.push(['est 180/95', estimateMeasurements({ height_cm: 180, weight_kg: 95, muscle: 0.4, bustFullness: 0, sex: 0, age_y: 30 }, { overwrite: true })]);
  const KEYS = FitLS.MEASURES;
  for (const [name, params] of cases) {
    const a = Fit.fitBody(tpl, params);
    const b = FitLS.fitBodyLS(tpl, params, { trace: true });
    const stats = (r) => {
      const errs = KEYS.filter((k) => Number.isFinite(params[k]) && Number.isFinite(r.residual[k])).map((k) => Math.abs(r.residual[k]));
      const worst = Math.max(...errs); const wk = KEYS.filter((k) => Number.isFinite(params[k]))[errs.indexOf(worst)];
      return { worst, wk, rms: Math.sqrt(errs.reduce((s, e) => s + e * e, 0) / errs.length) };
    };
    const sa = stats(a), sb = stats(b);
    const tag = (x) => (x.worst < 1 ? 'ok' : x.worst < 3 ? 'warn' : 'bad');
    say(`\n${name}`);
    say(`  diagonal  ${String(a.rounds).padStart(2)} rounds ${String(a.ms.toFixed(0)).padStart(4)} ms  <${tag(sa)}>worst ${sa.worst.toFixed(2)} cm (${sa.wk}) rms ${sa.rms.toFixed(2)}</${tag(sa)}>  clamped ${a.clamped.length}`);
    say(`  joint LS  ${String(b.rounds).padStart(2)} rounds ${String(b.ms.toFixed(0)).padStart(4)} ms  <${tag(sb)}>worst ${sb.worst.toFixed(2)} cm (${sb.wk}) rms ${sb.rms.toFixed(2)}</${tag(sb)}>  clamped ${b.clamped.length}${b.clamped.length ? ': ' + b.clamped.map((k) => k.replace(/^[a-z]+\//, '')).join(',') : ''}`);
    say('    ' + KEYS.filter((k) => Number.isFinite(params[k])).map((k) => `${k.replace('_cm', '')} ${b.measured[k].toFixed(1)}/${params[k]}`).join('  '));
    const spent = Object.entries(b.sliders).filter(([, v]) => Math.abs(v) > 0.05).sort((p, q) => Math.abs(q[1]) - Math.abs(p[1]));
    say('    detail sliders used: ' + (spent.filter(([k]) => !k.startsWith('measure/')).map(([k, v]) => `${k.replace(/^[a-z]+\//, '')} ${v.toFixed(2)}`).join('  ') || 'none'));
    say('    pinned: ' + (b.clamped.map((k) => `${k.replace(/^[a-z]+\//, '')}=${b.sliders[k] > 0 ? '+1' : '-1'}`).join('  ') || 'none'));
    if (q.get('trace') && (name === 'child_10' || name.startsWith('est'))) {
      for (const t of b.trace) say(`      r${t.round} worst ${t.worst} h=${t.heightSlider} err ${t.err.map(([k, v]) => k + (v > 0 ? '+' : '') + v).join(' ')}` +
        (t.s ? '  | step ' + t.s.map(([k, a, z]) => `${k} ${a}->${z}`).join(' ') : ''));
    }
  }
}

if (todo.includes('fitlsgrid')) {
  // Solver settings against the eight cases: rms (cm) per case and the mean, for each variant.
  head('fitLS settings grid (rms cm per case)');
  const est = estimateMeasurements({ height_cm: 180, weight_kg: 95, muscle: 0.4, age_y: 30, bustFullness: 0 });
  const heavy = estimateMeasurements({ height_cm: 170, weight_kg: 120, muscle: 0.3, age_y: 45, bustFullness: 0.6, sex: 1 });
  const cases = [['female_m', BODY_PRESETS.female_m], ['male_m', BODY_PRESETS.male_m], ['child_10', BODY_PRESETS.child_10],
    ['plus_f', BODY_PRESETS.plus_f], ['athletic_m', BODY_PRESETS.athletic_m], ['male_l', BODY_PRESETS.male_l], ['est180/95', est], ['120kg f', heavy]];
  const variants = (q.get('v') || 'base;broyden=0;broyden=0.5;damping=0.5;mu=20;damping=0.5,broyden=0.5;rounds=16').split(';');
  say('variant'.padEnd(26) + cases.map(([n]) => n.padStart(10)).join('') + '      mean   worst-any');
  for (const v of variants) {
    const o = {};
    if (v !== 'base') for (const kv of v.split(',')) { const [k, x] = kv.split('='); o[k] = Number(x); }
    const rms = [];
    let worstAny = 0;
    const tv0 = performance.now();
    for (const [, p] of cases) {
      let r;
      if (o.portfolio) {
        const a = FitLS.fitBodyLS(tpl, p, { broyden: 1 });
        const b = FitLS.fitBodyLS(tpl, p, { broyden: 0 });
        r = a.cost <= b.cost ? a : b;
      } else if (o.best) r = FitLS.fitBodyLSBest(tpl, p);
      else r = FitLS.fitBodyLS(tpl, p, o);
      let ss = 0, n = 0;
      for (const k of FitLS.MEASURES) if (typeof r.residual[k] === 'number') { ss += r.residual[k] ** 2; n++; worstAny = Math.max(worstAny, Math.abs(r.residual[k])); }
      rms.push(Math.sqrt(ss / n));
    }
    const mean = rms.reduce((a, b) => a + b, 0) / rms.length;
    say(v.padEnd(26) + rms.map((x) => x.toFixed(2).padStart(10)).join('') + mean.toFixed(3).padStart(10) + worstAny.toFixed(2).padStart(10)
      + ((performance.now() - tv0) / cases.length).toFixed(0).padStart(8) + ' ms/case');
  }
}

if (todo.includes('limbradius')) {
  // Does a limb station's search radius clip the loop on big bodies? If the girth keeps growing as the
  // radius widens past the default, the default was cutting part of the limb off.
  head('limb girth vs search radius (fitted bodies)');
  const big = {}; for (const d of (await import('/src/body/params.js')).PARAM_DEFS) big[d.key] = d.max;
  const heavy = estimateMeasurements({ height_cm: 170, weight_kg: 130, muscle: 0.3, age_y: 45, bustFullness: 0.6, sex: 1 });
  for (const [name, p] of [['female_m', BODY_PRESETS.female_m], ['plus_f', BODY_PRESETS.plus_f], ['130 kg', heavy], ['all max', big]]) {
    const m = buildTemplateBody(tpl, (await import('/src/body/params.js')).clampParams(p), {});
    const pos = new Float32Array(m.fit.pos);
    const J = (n) => jointAt(tpl, pos, n);
    const st = [
      ['thigh', J('l-upper-leg'), J('l-knee'), 0.20, 0.12, 0.030, [0.10, 0.12, 0.14, 0.16, 0.20]],
      ['upperArm', J('l-shoulder'), J('l-elbow'), 0.30, 0.09, 0.030, [0.07, 0.09, 0.11, 0.13, 0.15]],
      ['calf', J('l-knee'), J('l-ankle'), 0.28, 0.10, 0.030, [0.08, 0.10, 0.12, 0.14, 0.16]],
    ];
    for (const [k, a, b, t, r0, band, radii] of st) {
      const row = radii.map((r) => { const g = limbGirth(tpl, pos, a, b, t, r, band); return (r === r0 ? '*' : '') + r.toFixed(2) + ':' + (g ? (g.girth * 100).toFixed(1) : '-'); });
      say(`  ${name.padEnd(9)} ${k.padEnd(9)} ${row.join('  ')}`);
    }
  }
}

if (todo.includes('limbdiag')) {
  head('limb section diagnostics (female_m)');
  const { pos } = bodyOf(CASES[1][1]);
  const J = (n) => jointAt(tpl, pos, n);
  const stations = [
    ['upperArm', J('l-shoulder'), J('l-elbow'), 0.30, 0.09, 0.030],
    ['forearm', J('l-elbow'), J('l-hand'), 0.22, 0.08, 0.030],
    ['wrist', J('l-elbow'), J('l-hand'), 0.88, 0.06, 0.020],
    ['thigh', J('l-upper-leg'), J('l-knee'), 0.20, 0.12, 0.030],
    ['calf', J('l-knee'), J('l-ankle'), 0.28, 0.10, 0.030],
    ['ankle', J('l-knee'), J('l-ankle'), 0.90, 0.07, 0.020],
  ];
  for (const [name, a, b, t, r, band] of stations) {
    // rebuild the rotated sub-mesh the way limbGirth does, but report its internals
    const d = limbDiag(tpl, pos, a, b, t, r, band);
    say(`  ${name.padEnd(9)} axisLen=${d.len.toFixed(3)} kept=${String(d.kept).padStart(5)} v, ` +
        `${String(d.tris).padStart(5)} tris | segs=${String(d.segs).padStart(4)} comps=[${d.comps.join(',')}] ` +
        `-> hull ${d.hull} pts, girth ${(d.girth * 100).toFixed(1)} cm  ` +
        `(R*u = ${d.ru.map((v) => v.toFixed(3)).join(',')})`);
  }
}

function limbDiag(tpl, pos, a, b, t, radius, band) {
  const ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
  const len = Math.hypot(ax, ay, az) || 1;
  const ux = ax / len, uy = ay / len, uz = az / len;
  const wx = -uz, wy = 0, wz = ux;
  const s = Math.hypot(wx, wy, wz), c = uy;
  let R;
  if (s < 1e-9) R = c > 0 ? [1, 0, 0, 0, 1, 0, 0, 0, 1] : [1, 0, 0, 0, -1, 0, 0, 0, -1];
  else {
    const kx = wx / s, ky = wy / s, kz = wz / s, C = 1 - c;
    R = [c + kx * kx * C, kx * ky * C - kz * s, kx * kz * C + ky * s,
      ky * kx * C + kz * s, c + ky * ky * C, ky * kz * C - kx * s,
      kz * kx * C - ky * s, kz * ky * C + kx * s, c + kz * kz * C];
  }
  const ru = [R[0] * ux + R[1] * uy + R[2] * uz, R[3] * ux + R[4] * uy + R[5] * uz, R[6] * ux + R[7] * uy + R[8] * uz];
  const px = a[0] + ax * t, py = a[1] + ay * t, pz = a[2] + az * t;
  const seed = new Uint8Array(tpl.nBodyVerts);
  for (let i = 0; i < tpl.nBodyVerts; i++) {
    const dx = pos[i * 3] - px, dy = pos[i * 3 + 1] - py, dz = pos[i * 3 + 2] - pz;
    const along = dx * ux + dy * uy + dz * uz;
    if (Math.abs(along) > band) continue;
    const rx = dx - along * ux, ry = dy - along * uy, rz = dz - along * uz;
    if (rx * rx + ry * ry + rz * rz > radius * radius) continue;
    seed[i] = 1;
  }
  const keep = new Int32Array(tpl.nBodyVerts).fill(-1);
  const rot = [];
  const tri = [];
  const take = (v) => {
    if (keep[v] >= 0) return keep[v];
    const dx = pos[v * 3] - px, dy = pos[v * 3 + 1] - py, dz = pos[v * 3 + 2] - pz;
    keep[v] = rot.length / 3;
    rot.push(R[0] * dx + R[1] * dy + R[2] * dz, R[3] * dx + R[4] * dy + R[5] * dz, R[6] * dx + R[7] * dy + R[8] * dz);
    return keep[v];
  };
  for (let k = 0; k < tpl.indices.length; k += 3) {
    const v0 = tpl.indices[k], v1 = tpl.indices[k + 1], v2 = tpl.indices[k + 2];
    if (!seed[v0] && !seed[v1] && !seed[v2]) continue;
    tri.push(take(v0), take(v1), take(v2));
  }
  const rp = Float32Array.from(rot);
  if (!tri.length) return { len, kept: rp.length / 3, tris: 0, segs: 0, comps: [], hull: 0, girth: 0, ru };
  const sub = { indices: Uint32Array.from(tri), nTris: tri.length / 3, nBodyVerts: rp.length / 3 };
  const ix2 = buildIndex(sub, rp);
  const segs = horizontalSegments(ix2, 0);
  const comps = components(segs).map((x) => x.n).sort((p, r) => r - p);
  const g = girthAt(ix2, 0, {});
  return { len, kept: rp.length / 3, tris: tri.length / 3, segs: segs.length / 4, comps, hull: g ? g.hull.length / 2 : 0, girth: g ? g.girth : 0, ru };
}

out.innerHTML = L.join('\n')
  .replace(/</g, '').replace(/ok>/g, '<span class="ok">').replace(/\/ok>/g, '</span>')
  .replace(/bad>/g, '<span class="bad">').replace(/\/bad>/g, '</span>')
  .replace(//g, '&lt;');
window.__bodycheck = { done: true, text: L.join('\n') };
</script>
