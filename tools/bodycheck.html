<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body check</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
} }
</script>
<style>body{font:12px/1.45 ui-monospace,monospace;background:#1e1f22;color:#ddd;margin:14px}
pre{white-space:pre-wrap} .ok{color:#7c6} .bad{color:#f77} h3{margin:14px 0 4px;color:#9cf}</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Numeric checks for the template body. Runs whatever ?do= asks for and prints plain text, so the
// results can be read back with get_page_text. ?do=macro,measure,fit,...
import { loadTemplate, applyTargets, computeNormals, jointAt } from '/src/body/template.js';
import * as Macro from '/src/body/macro.js';
import { measureTemplate } from '/src/body/measureTemplate.js';
import { buildIndex, horizontalSegments, components, girthAt } from '/src/body/section.js';
import * as Fit from '/src/body/fit.js';

const q = new URLSearchParams(location.search);
const todo = (q.get('do') || 'macro').split(',').map(s => s.trim()).filter(Boolean);
const out = document.getElementById('out');
const L = [];
const say = (s = '') => { L.push(s); out.textContent = L.join('\n'); };
const head = (s) => say('\n=== ' + s + ' ===');

const t0 = performance.now();
const tpl = await loadTemplate('/assets/body/');
say(`template: ${tpl.nVerts} verts (${tpl.nBodyVerts} body), ${tpl.nTris} tris, ${tpl.targets.size} targets, ` +
    `rest height ${tpl.restHeight_m.toFixed(4)} m, loaded in ${(performance.now() - t0).toFixed(0)} ms`);

const CASES = [
  ['female_s', { height_cm: 160, weight_kg: 53, muscle: 0.30, age_y: 28, sex: 1, bustFullness: 0.35 }],
  ['female_m', { height_cm: 165, weight_kg: 58.5, muscle: 0.35, age_y: 30, sex: 1, bustFullness: 0.40 }],
  ['female_l', { height_cm: 170, weight_kg: 70, muscle: 0.30, age_y: 35, sex: 1, bustFullness: 0.50 }],
  ['male_s', { height_cm: 172, weight_kg: 65, muscle: 0.45, age_y: 28, sex: 0, bustFullness: 0 }],
  ['male_m', { height_cm: 178, weight_kg: 75, muscle: 0.50, age_y: 32, sex: 0, bustFullness: 0 }],
  ['male_l', { height_cm: 184, weight_kg: 92, muscle: 0.40, age_y: 45, sex: 0, bustFullness: 0 }],
  ['child_10', { height_cm: 140, weight_kg: 33, muscle: 0.30, age_y: 10, sex: 0.5, bustFullness: 0 }],
  ['plus_f', { height_cm: 168, weight_kg: 92, muscle: 0.25, age_y: 40, sex: 1, bustFullness: 0.70 }],
  ['athletic_m', { height_cm: 182, weight_kg: 80, muscle: 0.85, age_y: 27, sex: 0, bustFullness: 0 }],
];

function bodyOf(p, heightSlider) {
  const w = Macro.macroWeightsFor(p, heightSlider);
  return { weights: w, pos: applyTargets(tpl, w) };
}
function heightOf(pos) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < tpl.nBodyVerts; i++) { const y = pos[i * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  return hi - lo;
}

if (todo.includes('macro')) {
  head('macro weights');
  let missing = 0, worstSum = 0;
  for (const [name, p] of CASES) {
    const s = Macro.macroSliders(p);
    const w = Macro.macroWeights(s);
    let sum = 0; const bad = [];
    for (const [k, v] of w) {
      sum += v;
      // the average/average build corner is an all-zero MakeHuman file our asset build drops
      if (!tpl.targets.has(k) && !/universal-.*-averagemuscle-averageweight$/.test(k)) bad.push(k);
    }
    missing += bad.length;
    worstSum = Math.max(worstSum, Math.abs(sum - 2));   // ethnicity layer + build layer = 1 + 1
    say(`${name.padEnd(11)} female=${s.female.toFixed(2)} age=${s.age.toFixed(3)} muscle=${s.muscle.toFixed(2)} ` +
        `weight=${s.weight.toFixed(3)} | ${String(w.size).padStart(2)} targets sum=${sum.toFixed(4)}` +
        (bad.length ? `  MISSING: ${bad.join(', ')}` : ''));
  }
  say(missing === 0 ? `<ok>all target names resolve</ok>` : `<bad>${missing} missing target names</bad>`);
  say(worstSum < 1e-6 ? `<ok>weights partition exactly (ethnic 1 + build 1)</ok>`
                      : `<bad>weight sums off by up to ${worstSum.toFixed(6)}</bad>`);
}

if (todo.includes('height')) {
  head('height slider response (macro only, no solve yet)');
  for (const [name, p] of CASES) {
    const hs = [0, 0.25, 0.5, 0.75, 1].map((h) => heightOf(bodyOf(p, h).pos));
    say(`${name.padEnd(11)} wanted ${(p.height_cm / 100).toFixed(3)} m | slider 0..1 -> ` +
        hs.map((h) => h.toFixed(3)).join('  '));
  }
}

if (todo.includes('perf')) {
  head('morph cost');
  const p = CASES[1][1];
  const w = Macro.macroWeightsFor(p, 0.7);
  const buf = new Float32Array(tpl.rest.length);
  let t = performance.now(); for (let i = 0; i < 20; i++) applyTargets(tpl, w, buf);
  const morph = (performance.now() - t) / 20;
  const nbuf = new Float32Array(tpl.rest.length);
  t = performance.now(); for (let i = 0; i < 20; i++) computeNormals(tpl, buf, nbuf);
  const norm = (performance.now() - t) / 20;
  say(`applyTargets ${morph.toFixed(2)} ms  (${w.size} targets)`);
  say(`computeNormals ${norm.toFixed(2)} ms  (${tpl.nTris} tris)`);
}

if (todo.includes('joints')) {
  head('joint landmarks (female_m macro)');
  const { pos } = bodyOf(CASES[1][1]);
  const names = ['neck', 'l-shoulder', 'r-shoulder', 'l-elbow', 'l-hand', 'pelvis', 'l-upper-leg', 'l-knee', 'l-ankle', 'head', 'spine-2'];
  for (const n of names) {
    const j = jointAt(tpl, pos, n);
    say(`  ${n.padEnd(12)} ${j ? j.map((v) => v.toFixed(3)).join(', ') : '<bad>MISSING</bad>'}`);
  }
  say(`  (${Object.keys(tpl.joints).length} joint groups available)`);
}

if (todo.includes('measure')) {
  head('measurements taken off the macro body (cm) — no measurement solve yet');
  const keys = ['height_cm', 'chest_cm', 'underbust_cm', 'waist_cm', 'hips_cm', 'neck_cm', 'shoulderWidth_cm',
    'upperArm_cm', 'forearm_cm', 'wrist_cm', 'thigh_cm', 'calf_cm', 'ankle_cm', 'armLength_cm',
    'inseam_cm', 'torsoLength_cm', 'headHeight_cm'];
  const WANT = {
    female_m: [165, 88, 76, 70, 96, 34, 38, 27, 23, 15.5, 54, 36, 22, 56, 76, 40, 22],
    male_m: [178, 98, 90, 84, 98, 39, 46, 30, 27, 17.5, 56, 38, 23.5, 62, 82, 44, 23],
    child_10: [140, 68, 62, 60, 72, 28, 31, 20, 18, 13, 40, 28, 19, 47, 65, 33, 20],
    plus_f: [168, 112, 98, 100, 122, 38, 41, 36, 28, 17.5, 68, 43, 25, 57, 76, 41, 22.5],
  };
  say('body'.padEnd(12) + keys.map((k) => k.replace('_cm', '').slice(0, 7).padStart(8)).join(''));
  const tA = performance.now();
  for (const [name, p] of CASES) {
    const { pos } = bodyOf(p);
    const m = measureTemplate(tpl, pos);
    say(name.padEnd(12) + keys.map((k) => m[k].toFixed(1).padStart(8)).join(''));
    if (WANT[name]) say(('  want').padEnd(12) + WANT[name].map((v) => v.toFixed(1).padStart(8)).join(''));
  }
  say(`(${((performance.now() - tA) / CASES.length).toFixed(0)} ms per full measurement)`);
}

if (todo.includes('fit')) {
  head('measurement solve');
  const gains = Fit.calibrate(tpl);
  say('cm per unit slider on the neutral template:');
  say('  ' + Object.keys(gains).map((k) => `${k.replace('_cm', '')}=${Number.isFinite(gains[k]) ? gains[k].toFixed(2) : 'n/a'}`).join('  '));
  const WANT = {
    female_m: { height_cm: 165, chest_cm: 88, underbust_cm: 76, waist_cm: 70, hips_cm: 96, neck_cm: 34, shoulderWidth_cm: 38, upperArm_cm: 27, wrist_cm: 15.5, thigh_cm: 54, calf_cm: 36, ankle_cm: 22, armLength_cm: 56, inseam_cm: 76, torsoLength_cm: 40 },
    male_m: { height_cm: 178, chest_cm: 98, underbust_cm: 90, waist_cm: 84, hips_cm: 98, neck_cm: 39, shoulderWidth_cm: 46, upperArm_cm: 30, wrist_cm: 17.5, thigh_cm: 56, calf_cm: 38, ankle_cm: 23.5, armLength_cm: 62, inseam_cm: 82, torsoLength_cm: 44 },
    plus_f: { height_cm: 168, chest_cm: 112, underbust_cm: 98, waist_cm: 100, hips_cm: 122, neck_cm: 38, shoulderWidth_cm: 41, upperArm_cm: 36, wrist_cm: 17.5, thigh_cm: 68, calf_cm: 43, ankle_cm: 25, armLength_cm: 57, inseam_cm: 76, torsoLength_cm: 41 },
    child_10: { height_cm: 140, chest_cm: 68, underbust_cm: 62, waist_cm: 60, hips_cm: 72, neck_cm: 28, shoulderWidth_cm: 31, upperArm_cm: 20, wrist_cm: 13, thigh_cm: 40, calf_cm: 28, ankle_cm: 19, armLength_cm: 47, inseam_cm: 65, torsoLength_cm: 33 },
    athletic_m: { height_cm: 182, chest_cm: 104, underbust_cm: 94, waist_cm: 82, hips_cm: 98, neck_cm: 40, shoulderWidth_cm: 49, upperArm_cm: 34, wrist_cm: 18, thigh_cm: 60, calf_cm: 40, ankle_cm: 24, armLength_cm: 64, inseam_cm: 84, torsoLength_cm: 45 },
  };
  for (const [name, p] of CASES) {
    if (!WANT[name]) continue;
    const params = { ...p, ...WANT[name] };
    const r = Fit.fitBody(tpl, params);
    const keys = Object.keys(WANT[name]);
    const errs = keys.map((k) => Math.abs(r.residual[k] || 0));
    const worst = Math.max(...errs);
    const worstKey = keys[errs.indexOf(worst)];
    const rms = Math.sqrt(errs.reduce((s, e) => s + e * e, 0) / errs.length);
    const tag = worst < 1 ? 'ok' : 'bad';
    say(`\n${name}  ${r.rounds} rounds, ${r.ms.toFixed(0)} ms  ` +
        `<${tag}>worst ${worst.toFixed(2)} cm (${worstKey}), rms ${rms.toFixed(2)} cm</${tag}>` +
        (r.clamped.length ? `  clamped: ${r.clamped.join(',')}` : ''));
    say('  ' + keys.map((k) => `${k.replace('_cm', '')} ${r.measured[k].toFixed(1)}/${WANT[name][k]}`).join('  '));
  }
}

if (todo.includes('neckprofile')) {
  head('girth up the neck column (female_m macro)');
  const { pos } = bodyOf(CASES[1][1]);
  const ix = buildIndex(tpl, pos);
  const J = (n) => jointAt(tpl, pos, n);
  const sh = J('l-shoulder'), nk = J('neck'), jw = J('jaw'), hd = J('head');
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < tpl.nBodyVerts; i++) { const y = pos[i * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  say(`  shoulder y=${sh[1].toFixed(3)}  neck y=${nk[1].toFixed(3)}  jaw y=${jw ? jw[1].toFixed(3) : 'n/a'}  head y=${hd[1].toFixed(3)}  top=${hi.toFixed(3)}`);
  for (let y = sh[1]; y <= (hd ? hd[1] : nk[1] + 0.1); y += 0.008) {
    const g = girthAt(ix, y, {});
    const comps = components(horizontalSegments(ix, y)).filter((c) => c.n >= 8).length;
    say(`   y=${y.toFixed(3)}  girth ${g ? (g.girth * 100).toFixed(1).padStart(6) : '     -'} cm  w=${g ? (g.width * 100).toFixed(1) : '-'}  loops=${comps}`);
  }
}

if (todo.includes('limbdiag')) {
  head('limb section diagnostics (female_m)');
  const { pos } = bodyOf(CASES[1][1]);
  const J = (n) => jointAt(tpl, pos, n);
  const stations = [
    ['upperArm', J('l-shoulder'), J('l-elbow'), 0.30, 0.09, 0.030],
    ['forearm', J('l-elbow'), J('l-hand'), 0.22, 0.08, 0.030],
    ['wrist', J('l-elbow'), J('l-hand'), 0.88, 0.06, 0.020],
    ['thigh', J('l-upper-leg'), J('l-knee'), 0.20, 0.12, 0.030],
    ['calf', J('l-knee'), J('l-ankle'), 0.28, 0.10, 0.030],
    ['ankle', J('l-knee'), J('l-ankle'), 0.90, 0.07, 0.020],
  ];
  for (const [name, a, b, t, r, band] of stations) {
    // rebuild the rotated sub-mesh the way limbGirth does, but report its internals
    const d = limbDiag(tpl, pos, a, b, t, r, band);
    say(`  ${name.padEnd(9)} axisLen=${d.len.toFixed(3)} kept=${String(d.kept).padStart(5)} v, ` +
        `${String(d.tris).padStart(5)} tris | segs=${String(d.segs).padStart(4)} comps=[${d.comps.join(',')}] ` +
        `-> hull ${d.hull} pts, girth ${(d.girth * 100).toFixed(1)} cm  ` +
        `(R*u = ${d.ru.map((v) => v.toFixed(3)).join(',')})`);
  }
}

function limbDiag(tpl, pos, a, b, t, radius, band) {
  const ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
  const len = Math.hypot(ax, ay, az) || 1;
  const ux = ax / len, uy = ay / len, uz = az / len;
  const wx = -uz, wy = 0, wz = ux;
  const s = Math.hypot(wx, wy, wz), c = uy;
  let R;
  if (s < 1e-9) R = c > 0 ? [1, 0, 0, 0, 1, 0, 0, 0, 1] : [1, 0, 0, 0, -1, 0, 0, 0, -1];
  else {
    const kx = wx / s, ky = wy / s, kz = wz / s, C = 1 - c;
    R = [c + kx * kx * C, kx * ky * C - kz * s, kx * kz * C + ky * s,
      ky * kx * C + kz * s, c + ky * ky * C, ky * kz * C - kx * s,
      kz * kx * C - ky * s, kz * ky * C + kx * s, c + kz * kz * C];
  }
  const ru = [R[0] * ux + R[1] * uy + R[2] * uz, R[3] * ux + R[4] * uy + R[5] * uz, R[6] * ux + R[7] * uy + R[8] * uz];
  const px = a[0] + ax * t, py = a[1] + ay * t, pz = a[2] + az * t;
  const seed = new Uint8Array(tpl.nBodyVerts);
  for (let i = 0; i < tpl.nBodyVerts; i++) {
    const dx = pos[i * 3] - px, dy = pos[i * 3 + 1] - py, dz = pos[i * 3 + 2] - pz;
    const along = dx * ux + dy * uy + dz * uz;
    if (Math.abs(along) > band) continue;
    const rx = dx - along * ux, ry = dy - along * uy, rz = dz - along * uz;
    if (rx * rx + ry * ry + rz * rz > radius * radius) continue;
    seed[i] = 1;
  }
  const keep = new Int32Array(tpl.nBodyVerts).fill(-1);
  const rot = [];
  const tri = [];
  const take = (v) => {
    if (keep[v] >= 0) return keep[v];
    const dx = pos[v * 3] - px, dy = pos[v * 3 + 1] - py, dz = pos[v * 3 + 2] - pz;
    keep[v] = rot.length / 3;
    rot.push(R[0] * dx + R[1] * dy + R[2] * dz, R[3] * dx + R[4] * dy + R[5] * dz, R[6] * dx + R[7] * dy + R[8] * dz);
    return keep[v];
  };
  for (let k = 0; k < tpl.indices.length; k += 3) {
    const v0 = tpl.indices[k], v1 = tpl.indices[k + 1], v2 = tpl.indices[k + 2];
    if (!seed[v0] && !seed[v1] && !seed[v2]) continue;
    tri.push(take(v0), take(v1), take(v2));
  }
  const rp = Float32Array.from(rot);
  if (!tri.length) return { len, kept: rp.length / 3, tris: 0, segs: 0, comps: [], hull: 0, girth: 0, ru };
  const sub = { indices: Uint32Array.from(tri), nTris: tri.length / 3, nBodyVerts: rp.length / 3 };
  const ix2 = buildIndex(sub, rp);
  const segs = horizontalSegments(ix2, 0);
  const comps = components(segs).map((x) => x.n).sort((p, r) => r - p);
  const g = girthAt(ix2, 0, {});
  return { len, kept: rp.length / 3, tris: tri.length / 3, segs: segs.length / 4, comps, hull: g ? g.hull.length / 2 : 0, girth: g ? g.girth : 0, ru };
}

out.innerHTML = L.join('\n')
  .replace(/</g, '').replace(/ok>/g, '<span class="ok">').replace(/\/ok>/g, '</span>')
  .replace(/bad>/g, '<span class="bad">').replace(/\/bad>/g, '</span>')
  .replace(//g, '&lt;');
window.__bodycheck = { done: true, text: L.join('\n') };
</script>
</body>
</html>
